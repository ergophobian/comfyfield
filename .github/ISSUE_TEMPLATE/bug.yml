name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Paste the error text.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: System
      placeholder: macOS 26 / Windows 11 / Ubuntu 24.04, Node 22, Chrome
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshot
