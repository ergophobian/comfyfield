name: Build and checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          # Explicit versions preserve the macOS .app bundle (setup-chrome #658).
          chrome-version: 155.0.8059.84
      - run: npx vite build
      - run: node scripts/verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: node bin/comfyfield.js --help
