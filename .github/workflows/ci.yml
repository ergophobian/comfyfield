name: Build and checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: node scripts/flow-checks.mjs
      - run: node scripts/writer-check.mjs
      - run: node scripts/theme-check.mjs
      - run: node scripts/format-check.mjs
      - run: node scripts/format-runner-checks.mjs
      - run: node scripts/format-ui-check.mjs
        if: runner.os == 'Linux'
      - run: node bin/comfyfield.js --help
