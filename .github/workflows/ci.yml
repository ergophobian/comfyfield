name: Build and checks

# Budget: PRs run on Linux only, and a new push cancels the PR's older run.
# Main runs all three systems. Label a PR full-ci to run all three before merging.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore: ['**.md', 'research_notes/**', 'docs/**', '**/screenshots/**', 'site/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'research_notes/**', 'docs/**', '**/screenshots/**', 'site/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          # Explicit versions preserve the macOS .app bundle (setup-chrome #658).
          chrome-version: 155.0.8059.84
      - run: npx vite build
      - run: node scripts/verify.mjs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - run: node bin/comfyfield.js --help

  # Linux only: builds the image and checks that it serves the app. Never pushes the image.
  docker:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t comfyfield .
      - name: Run the image and fetch the app
        run: |
          docker run -d --name comfyfield -p 127.0.0.1:5173:5173 comfyfield
          for i in $(seq 1 30); do curl -fsS http://localhost:5173/ -o /dev/null && break; sleep 2; done
          curl -fsS http://localhost:5173/ | grep -q 'id="root"'
          curl -fsS http://localhost:5173/api/connections
          docker exec comfyfield node -e "require('child_process').execFileSync(require('ffmpeg-static'), ['-version'])"
          docker exec comfyfield test -w /data/.comfyfield
      - if: always()
        run: docker logs comfyfield || true
